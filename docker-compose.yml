services:
  postgres:
    image: postgres:16-alpine
    container_name: facielis-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: facielis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facielis-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/facielis"
      JWT_SECRET: "facielis-production-super-secret-key-replace-with-env"
      NODE_ENV: "production"
      PORT: "5000"
      WEB_PORT: "3847"
      CORS_ORIGIN: "http://localhost:3847,http://localhost:5000"
      BACKEND_ORIGIN: "http://localhost:5000"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
    ports:
      - "5000:5000"
      - "3847:3847"

volumes:
  postgres_data:
